name: CloudFormation PR Validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'cloudformation/**'

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Validate template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/s3-bucket.yaml

      - name: Deploy test stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/s3-bucket.yaml \
            --stack-name pr-${{ github.event.pull_request.number }}-test \
            --parameter-overrides Environment=test \
            --capabilities CAPABILITY_IAM

      - name: Get bucket name
        id: bucket
        run: |
          echo "name=$(aws cloudformation describe-stacks \
            --stack-name pr-${{ github.event.pull_request.number }}-test \
            --query 'Stacks[0].Outputs .OutputValue' \
            --output text)" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ CloudFormation validation passed!\n\n**Stack:** pr-${{ github.event.pull_request.number }}-test\n**Bucket:** ${{ steps.bucket.outputs.name }}`
            })
    
  cleanup-on-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Delete test stack
        run: |
          aws cloudformation delete-stack \
            --stack-name pr-${{ github.event.pull_request.number }}-test